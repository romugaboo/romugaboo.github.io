<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the rabbit orb, from live-romugaboo/marca -->
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF8FF"/>
      <stop offset=".30" stop-color="#8FD8F0"/>
      <stop offset=".62" stop-color="#45AFC9"/>
      <stop offset=".84" stop-color="#6ED0BC"/>
      <stop offset="1" stop-color="#9BE7D2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#fff"/>
  <circle cx="32" cy="32" r="29" fill="url(#orb)"/>
  <ellipse cx="32" cy="17" rx="25" ry="13.5" fill="url(#gloss)" clip-path="url(#disc)"/>
  <g transform="translate(8.3 8.3) scale(1.975)">
    <g fill="#fff"><ellipse cx="8.7" cy="5.6" rx="2.9" ry="4.1"/><ellipse cx="15.3" cy="5.6" rx="2.9" ry="4.1"/></g>
    <g fill="#0A3F52" opacity=".78"><ellipse cx="8.7" cy="5.8" rx="1.3" ry="2.3"/><ellipse cx="15.3" cy="5.8" rx="1.3" ry="2.3"/></g>
    <ellipse cx="12" cy="15.6" rx="7.9" ry="7.4" fill="#fff"/>
    <g fill="#0A3F52" opacity=".78">
      <rect x="6.7" y="14.35" width="5.2" height="2.3" rx="1.15" transform="rotate(-33 9.3 15.5)"/>
      <rect x="12.1" y="14.35" width="5.2" height="2.3" rx="1.15" transform="rotate(33 14.7 15.5)"/>
    </g>
  </g>
</svg>
